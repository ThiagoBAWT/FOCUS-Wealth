<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 120" width="100%" height="100%">
  <defs>
    <style>
      .text-title {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .text-subtitle {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 8.5px;
        fill: #e7c3c9;
      }
    </style>
  </defs>

  <!-- ICONE: mira de foco (cantos de enquadramento + ponto central) -->
  <g transform="translate(10, 10)" stroke="#ffffff" stroke-width="9" stroke-linecap="square" fill="none">
    <path d="M 0,32 L 0,0 L 32,0" />
    <path d="M 68,0 L 100,0 L 100,32" />
    <path d="M 100,68 L 100,100 L 68,100" />
    <path d="M 32,100 L 0,100 L 0,68" />
    <circle cx="50" cy="50" r="10" fill="#ffffff" stroke="none" />
  </g>

  <line x1="132" y1="18" x2="132" y2="102" stroke="#ffffff" stroke-width="1.5" opacity="0.35" />

  <g transform="translate(158, 0)">
    <text x="0" y="58" class="text-title">FOCUS</text>
    <text x="2" y="84" class="text-subtitle">WEALTH</text>
  </g>
</svg>
