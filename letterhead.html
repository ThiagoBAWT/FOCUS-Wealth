<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Papel Timbrado — FOCUS Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 210mm; height: 297mm;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    position: relative;
  }
  .header {
    position: absolute;
    top: 16mm;
    left: 18mm;
    right: 18mm;
    height: 13mm;
    display: flex;
    align-items: center;
  }
  .logo { height: 13mm; width: auto; flex: 0 0 auto; display: block; }
  .header-rule {
    flex: 1 1 auto;
    height: 1px;
    background: #7a1f2b;
    opacity: 0.35;
    margin-left: 10mm;
  }

  .footer-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 24mm;
    background: #7a1f2b;
    overflow: hidden;
  }
  .footer-bar::before {
    content: "";
    position: absolute;
    left: -15mm;
    top: -15mm;
    width: 30mm;
    height: 30mm;
    background: #ffffff;
    border-radius: 50%;
  }
  .contact {
    position: absolute;
    left: 18mm;
    bottom: 30mm;
    font-size: 9.5pt;
    color: #2b2b2b;
    z-index: 2;
  }
  .contact div {
    display: flex;
    align-items: center;
    gap: 3mm;
    margin-bottom: 2.4mm;
  }
  .contact .badge {
    width: 6mm; height: 6mm;
    border-radius: 50%;
    background: #7a1f2b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .contact .badge svg { width: 3.2mm; height: 3.2mm; }
  .contact .badge svg path { fill: #ffffff; }
  .contact span { letter-spacing: 0.2pt; }
</style>
</head>
<body>
  <div class="header">
    <img class="logo" src="logo.svg" alt="FOCUS Wealth">
    <div class="header-rule"></div>
  </div>

  <div class="footer-bar"></div>

  <div class="contact">
    <div>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg></span>
      <span>+55 (11) 91555-2323</span>
    </div>
    <div>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7 8.5-5.7H3.5L12 12zM3.4 7.3 3 7.6V17h18V7.6l-.4-.3L12 13.4 3.4 7.3z"/></svg></span>
      <span>thiago.financeiro@yahoo.com.br</span>
    </div>
  </div>
</body>
</html>
