<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 120" width="100%" height="100%">
  <defs>
    <style>
      .brand-color { fill: #7a1f2b; }
      .text-title {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.5px;
        fill: #1c1a1a;
      }
      .text-subtitle {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 8.5px;
        fill: #7a1f2b;
      }
    </style>
  </defs>

  <!-- ICONE: mira de foco (cantos de enquadramento + ponto central) -->
  <g transform="translate(10, 10)" stroke="#7a1f2b" stroke-width="9" stroke-linecap="square" fill="none">
    <!-- canto superior esquerdo -->
    <path d="M 0,32 L 0,0 L 32,0" />
    <!-- canto superior direito -->
    <path d="M 68,0 L 100,0 L 100,32" />
    <!-- canto inferior direito -->
    <path d="M 100,68 L 100,100 L 68,100" />
    <!-- canto inferior esquerdo -->
    <path d="M 32,100 L 0,100 L 0,68" />
    <!-- ponto de foco central -->
    <circle cx="50" cy="50" r="10" fill="#7a1f2b" stroke="none" />
  </g>

  <!-- DIVISOR VERTICAL -->
  <line x1="132" y1="18" x2="132" y2="102" stroke="#7a1f2b" stroke-width="1.5" opacity="0.3" />

  <!-- TIPOGRAFIA -->
  <g transform="translate(158, 0)">
    <text x="0" y="58" class="text-title">FOCUS</text>
    <text x="2" y="84" class="text-subtitle">WEALTH</text>
  </g>
</svg>
